server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Keep directory redirects relative so the public reverse-proxy origin is
    # preserved instead of exposing this container's internal port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /contact {
        try_files /contact/index.html =404;
    }

    location = /contact/ {
        try_files /contact/index.html =404;
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|mjs|png|svg|webmanifest|webp|woff2?|wasm|task)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
